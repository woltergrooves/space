<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Long Race">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Long Race</title>
<style>
  :root { --panel: rgba(16,17,20,0.72); --line: rgba(255,236,205,0.16); --txt: #f1ead9; --dim: #a9a08c; --amber: #e8a83a; --red: #e0583a; --green: #7dc47a; --blue: #7aa7e0;
    --mono: ui-monospace, "SF Mono", Menlo, monospace; --st: env(safe-area-inset-top); --sb: env(safe-area-inset-bottom); --sl: env(safe-area-inset-left); --sr: env(safe-area-inset-right); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--txt); overflow: hidden; font-family: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  button { font-family: inherit; color: var(--txt); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-height: 44px; padding: 0 14px;
    font-size: 15px; font-weight: 600; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); touch-action: manipulation; }
  button:active { filter: brightness(1.5); }
  button.primary { background: var(--amber); color: #1b1408; border-color: transparent; }
  button.danger { background: #8a2e1f; border-color: transparent; }
  button:disabled { opacity: 0.4; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .screen { position: fixed; inset: 0; pointer-events: none; display: none; }
  .screen.on { display: block; }
  .screen > * { pointer-events: auto; }
  .mono { font-family: var(--mono); }
  .dim { color: var(--dim); }
  .tag { font-size: 11px; letter-spacing: .16em; color: var(--dim); text-transform: uppercase; }

  /* Hangar */
  #h-top { position: absolute; left: calc(10px + var(--sl)); right: calc(10px + var(--sr)); top: calc(8px + var(--st)); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #h-top b { font-size: 15px; }
  #h-missions { position: absolute; left: 0; right: 0; top: calc(78px + var(--st)); display: flex; gap: 8px; overflow-x: auto; padding: 0 calc(10px + var(--sr)) 4px calc(10px + var(--sl)); scrollbar-width: none; }
  #h-missions::-webkit-scrollbar { display: none; }
  .mcard { flex: 0 0 auto; width: 200px; padding: 10px 12px; text-align: left; min-height: 0; border-radius: 14px; font-weight: 400; }
  .mcard b { display: block; font-size: 14px; margin-bottom: 2px; }
  .mcard small { font-size: 12px; color: var(--dim); line-height: 1.3; display: block; }
  .mcard.sel { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
  .mcard .rw { color: var(--amber); font-size: 12px; margin-top: 4px; display: block; }
  #h-sheet { position: absolute; left: calc(8px + var(--sl)); right: calc(8px + var(--sr)); bottom: calc(8px + var(--sb)); padding: 10px 12px; max-height: 47vh; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .row:last-of-type { border-bottom: 0; }
  .row .nm { flex: 1; min-width: 0; font-size: 14px; }
  .row .nm small { display: block; color: var(--dim); font-size: 12px; }
  .row button { min-height: 40px; min-width: 40px; padding: 0 10px; border-radius: 12px; font-size: 14px; }
  .cnt { width: 22px; text-align: center; font-family: var(--mono); }
  .dvbar { position: relative; height: 16px; border-radius: 8px; background: rgba(255,255,255,0.08); overflow: hidden; margin: 8px 0 4px; }
  .dvbar > i { position: absolute; top: 0; bottom: 0; }
  .dvbar .need { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; }
  .stats { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; flex-wrap: wrap; }
  .warn { color: var(--red); font-size: 13px; margin-top: 4px; }
  .launch { width: 100%; margin-top: 10px; min-height: 52px; font-size: 17px; }

  /* Vlucht */
  #f-info { position: absolute; left: calc(10px + var(--sl)); top: calc(8px + var(--st)); padding: 8px 12px; font-size: 13px; line-height: 1.45; max-width: calc(100% - 186px - var(--sl) - var(--sr)); }
  #f-info .big { font-family: var(--mono); font-size: 15px; font-weight: 600; }
  #f-map { position: absolute; right: calc(10px + var(--sr)); top: calc(8px + var(--st)); width: 150px; height: 96px; padding: 0; overflow: hidden; }
  #f-map canvas { width: 100%; height: 100%; display: block; }
  #f-ticker { position: absolute; left: 50%; transform: translateX(-50%); top: calc(118px + var(--st)); width: min(92vw, 440px); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
  .msg { padding: 8px 12px; font-size: 14px; line-height: 1.3; text-align: center; transition: opacity .6s; border-radius: 12px; }
  .msg.warn { border-color: var(--amber); color: #ffd796; } .msg.bad { border-color: var(--red); color: #ffb3a3; } .msg.good { border-color: rgba(125,196,122,0.6); }
  #f-thr { position: absolute; left: calc(12px + var(--sl)); bottom: calc(14px + var(--sb)); width: 64px; height: min(46vh, 300px); padding: 0; touch-action: none; }
  #f-thr .fill { position: absolute; left: 6px; right: 6px; bottom: 6px; border-radius: 12px; background: linear-gradient(to top, #e8a83a, #f3d28a); }
  #f-thr .lbl { position: absolute; left: 0; right: 0; top: 8px; text-align: center; font: 600 13px var(--mono); mix-blend-mode: difference; }
  #f-thr .lim { position: absolute; left: 0; right: 0; height: 2px; background: var(--red); display: none; }
  #f-acts { position: absolute; right: calc(12px + var(--sr)); bottom: calc(14px + var(--sb)); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; width: min(52vw, 230px); }
  #f-acts button { width: 100%; }
  #f-acts .stage { min-height: 60px; font-size: 17px; letter-spacing: .06em; }
  #f-small { position: absolute; left: calc(88px + var(--sl)); bottom: calc(14px + var(--sb)); display: flex; flex-direction: column; gap: 8px; }
  #f-small button { min-width: 56px; padding: 0 10px; font-size: 14px; }
  #f-steer { display: none; gap: 8px; }
  #f-steer.on { display: flex; }
  #f-steer button { min-width: 56px; min-height: 52px; font-size: 20px; }
  .meter { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; margin-top: 3px; }
  .meter i { display: block; height: 100%; background: var(--amber); }

  /* Rapport */
  #report { position: fixed; inset: 0; overflow-y: auto; background: rgba(8,8,10,0.86); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); padding: calc(16px + var(--st)) calc(14px + var(--sr)) calc(20px + var(--sb)) calc(14px + var(--sl)); }
  #report .paper { max-width: 560px; margin: 0 auto; }
  #report h1 { font-size: 22px; margin: 6px 0 2px; font-weight: 700; }
  #report h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 20px 0 8px; font-weight: 600; }
  #report .photo { width: 100%; border-radius: 6px; border: 6px solid #efe7d4; box-shadow: 0 6px 20px rgba(0,0,0,0.5); transform: rotate(-0.8deg); }
  #report .cap { font-family: Georgia, serif; font-style: italic; color: #d8cfba; font-size: 14px; margin-top: 8px; }
  .ev { display: flex; gap: 10px; font-size: 14px; padding: 4px 0; }
  .ev .t { font-family: var(--mono); color: var(--dim); width: 64px; flex: 0 0 auto; }
  .ev.bad { color: #ffb3a3; } .ev.warn { color: #ffd796; } .ev.good { color: #b9e3b6; }
  .money { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .verdict { display: inline-block; padding: 4px 10px; border-radius: 10px; font-weight: 700; font-size: 13px; margin-top: 6px; }
  #toast { position: fixed; left: 50%; bottom: calc(90px + var(--sb)); transform: translateX(-50%); max-width: 88vw; padding: 10px 14px; font-size: 14px; opacity: 0; transition: opacity .4s; pointer-events: none; text-align: center; z-index: 10; }
  #toast.on { opacity: 1; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; background: #000; z-index: 20; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>

<div class="screen" id="hangar">
  <div id="h-top" class="panel"></div>
  <div id="h-missions"></div>
  <div id="h-sheet" class="panel"></div>
</div>

<div class="screen" id="flight">
  <div id="f-info" class="panel"></div>
  <div id="f-map" class="panel"><canvas width="380" height="192"></canvas></div>
  <div id="f-ticker"></div>
  <div id="f-thr" class="panel"><div class="fill"></div><div class="lim"></div><div class="lbl">0%</div></div>
  <div id="f-small">
    <div id="f-steer"><button data-steer="-1">⟲</button><button data-steer="1">⟳</button></div>
    <button id="b-assist">Assist</button>
    <button id="b-warp">⏩ ×1</button>
    <button id="b-photo">📷</button>
    <button id="b-menu">☰</button>
  </div>
  <div id="f-acts"></div>
</div>

<div class="screen" id="report"></div>
<div id="toast" class="panel"></div>
<div id="err"></div>
<script type="module" src="src/main.js"></script>
<script>addEventListener('error', (e) => { const el = document.getElementById('err'); el.style.display = 'flex'; el.textContent = 'Er ging iets mis: ' + e.message; });</script>
</body>
</html>
